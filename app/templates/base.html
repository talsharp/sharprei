<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Zip Code Performance{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <header>
    <h1>Zip Code Performance - Allegheny County</h1>
    <nav>
      <a href="/" class="{{ 'active' if active == 'list' else '' }}">Zip Codes</a>
      <a href="/import" class="{{ 'active' if active == 'import' else '' }}">Import File</a>
      <a href="/insights" class="{{ 'active' if active == 'insights' else '' }}">Insights</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
