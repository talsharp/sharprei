{% set today = local_today() %}
<div class="dtask{{ ' is-done' if t.is_done }}{{ ' overdue' if not t.is_done and t.due_date and t.due_date < today }}{{ ' due-today' if not t.is_done and t.due_date == today }}" data-id="{{ t.id }}">
  <div class="dtask-main">
    <span class="dtask-handle" title="Drag to change the order">⋮⋮</span>
    <select class="dtask-status" data-field="status_id" aria-label="Status" style="background:{{ t.status.color if t.status else '#C4C4C4' }};">
      {% if not t.status %}<option value="" selected>—</option>{% endif %}
      {% for s in statuses %}<option value="{{ s.id }}" data-color="{{ s.color }}" data-done="{{ 1 if s.is_done else 0 }}" {{ 'selected' if s.id == t.status_id }}>{{ s.name }}</option>{% endfor %}
    </select>
    <button type="button" class="dtask-open" title="Open">
      <span class="dtask-title">{{ t.title }}</span>
      {% if t.description %}<svg class="task-desc-icon" viewBox="0 0 24 24" aria-label="Has details"><path d="M5 7h14M5 12h14M5 17h9"/></svg>{% endif %}
    </button>
    <input type="date" class="dtask-date" data-field="due_date" min="2000-01-01" max="2100-12-31" value="{{ t.due_date.isoformat() if t.due_date else '' }}" aria-label="Date">
    <span class="dtask-when"></span>
    <button type="button" class="dtask-delete" title="Delete">×</button>
  </div>
  <div class="dtask-detail" hidden>
    <input type="text" data-field="title" value="{{ t.title }}" maxlength="255" aria-label="Task">
    <textarea data-field="description" rows="3" placeholder="More details, phone numbers, who to call...">{{ t.description or '' }}</textarea>
  </div>
</div>
