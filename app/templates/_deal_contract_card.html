<div class="card contract-card" id="contract-card">
  {% include "_deal_contract_stats.html" %}

  {# Saves on change into the boxes above. A date is only sent once its year is complete. #}
  <form class="contract-inputs" hx-post="/finance/deals/{{ deal.id }}/contract" hx-target="#contract-stats" hx-swap="outerHTML"
        hx-trigger="change[event.target.type !== 'date' || !event.target.value || event.target.value.slice(0, 4) >= '2000']"
        hx-on::after-request="if(event.detail.successful){window.syncContractFields && window.syncContractFields();}">
    <label>Inspection<span class="input-suffix"><input type="number" min="0" max="90" name="inspection_days" value="{{ deal.inspection_days or '' }}" placeholder="e.g. 10"> business days</span></label>
    <label title="Leave empty if there was no renegotiation">Renegotiated price ($)<input type="number" step="any" name="renegotiated_price" value="{{ '%g'|format(deal.renegotiated_price|float) if deal.renegotiated_price is not none else '' }}" placeholder="if renegotiated"></label>
    <span class="contract-divider"></span>
    <label>Buyer<input type="text" name="buyer_name" value="{{ deal.buyer_name or '' }}" list="buyer-names" placeholder="Found a buyer?" maxlength="120"></label>
    <label>Buyer's price ($)<input type="number" step="any" name="sell_price" value="{{ '%g'|format(deal.sell_price|float) if deal.sell_price is not none else '' }}" placeholder="0"></label>
    <label>Closing date<input type="date" name="closed_date" min="2000-01-01" max="2100-12-31" value="{{ deal.closed_date.isoformat() if deal.closed_date else '' }}"></label>
  </form>
</div>
